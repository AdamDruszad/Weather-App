<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forcast</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_cool_down"
    />
  </head>
  <body>
    <h1 class="text">GET THE WEATHER HERE</h1>
    <span class="material-symbols-outlined">arrow_cool_down</span>
    <form class="weatherForm">
      <input type="text" class="cityInput" placeholder="Enter city:" />
      <button type="submit">Get Weather</button>
    </form>

    <div class="card" style="display: none"></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="index.js"></script>
  </body>
</html>
